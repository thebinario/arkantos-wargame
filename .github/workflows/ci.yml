name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arkantos
          POSTGRES_PASSWORD: arkantos_dev
          POSTGRES_DB: arkantos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkantos -d arkantos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arkantos:arkantos_dev@localhost:5432/arkantos?schema=public
      SESSION_SECRET: ci-only-session-secret-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm build
