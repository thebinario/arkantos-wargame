services:
  postgres:
    image: postgres:16-alpine
    container_name: arkantos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkantos
      POSTGRES_PASSWORD: arkantos_dev
      POSTGRES_DB: arkantos
    ports:
      - "5432:5432"
    volumes:
      - arkantos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkantos -d arkantos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arkantos-postgres-data:
